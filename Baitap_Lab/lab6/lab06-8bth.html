<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vong lap for-in cac so tu 1-10</title>
</head>
<body>
    <h1>Vòng lặp for-in: Các số từ 1 đến 10</h1>
    <hr>
    <script>
        for (var i = 1; i <= 10; i++) {
            document.write("<p>" + i + "</p>");
        }
    </script>
</body>
</html>
