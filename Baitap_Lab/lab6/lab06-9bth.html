<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vong lap while 1-10</title>
</head>
<body>
    <h1>Vòng lặp while: Các số từ 1 đến 10</h1>
    <hr>
    <script>
        var i = 1;
        while (i <= 10) {
            document.write("<p>" + i + "</p>");
            i++;
        }
    </script>
</body>
</html>
