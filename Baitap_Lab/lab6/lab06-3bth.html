<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ham alert; confirm; prompt</title>
</head>
<body>
    <h1>Su dung cac ham alert, confirm, prompt</h1>
    
    <script>
        debugger; //chay tung buoc(dong lenh) de kiem tra loi
        console.log("Hello world");

        var name = prompt("Nhap ten cua ban:");
        alert("welcome to," + name);
        console.log("welcome to," + name);

        let check = confirm("Ban co muon xoa khong?");
        console.log("Ban da chon: " + check);
    </script>
</body>
</html>
