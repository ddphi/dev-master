<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toán tử trong js</title>
</head>
<body>
    <h1>Toán tử trong js</h1>
    <hr>
    <script>
        let a = parseFloat(prompt("Nhap so a:"));
        let b = parseFloat(prompt("Nhap so b:"));

        document.write("<p> a + b = " + (a + b));
        document.write("<p> a - b = " + (a - b));
        document.write("<p> a * b = " + (a * b));
        document.write("<p> a / b = " + (a / b));   
        document.write("<p> a % b = " + (a % b));
    </script>
</body>
</html>
