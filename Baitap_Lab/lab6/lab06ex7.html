<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab06 - Ex7</title>
    <style>
        .container {
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            border: 2px solid #228b22;
            border-radius: 10px;
            padding: 20px 40px;
            width: max-content;
            margin: 50px auto;
        }
        h2 {
            color: #008000;
            font-family: sans-serif;
            margin-top: 0;
            margin-bottom: 15px;
        }
        hr {
            border: none;
            border-top: 2px solid #228b22;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <script>
        let pattern = "<div class='container'>";
        pattern += "<h2>Tháp ký tự 10 dòng</h2>";
        pattern += "<hr>";
        
        for (let i = 0; i < 10; i++) {
            let row = "";
            for (let j = 0; j <= i; j++) {
                row += String.fromCharCode(65 + j) + " ";
            }
            for (let j = i - 1; j >= 0; j--) {
                row += String.fromCharCode(65 + j) + " ";
            }
            pattern += row.trim() + "<br>";
        }
        
        pattern += "</div>";
        document.write(pattern);
    </script>
</body>
</html>
