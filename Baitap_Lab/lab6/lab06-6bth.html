<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giai phuong trinh bac hai</title>
    <style>
        h1 {
            color: green;
        }

        h2 {
            color: red;
        }

        p {
            margin: 1rem 0;
        }

        form div {
            margin-bottom: 10px;
            margin: 1rem 0;
            display: flex;
            align-items: center;
        }

        form label {
            font-weight: bold;
            width: 80px;
        }

        input[type="number"] {
            padding: .5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            padding: .5rem 1rem;
            background-color: green;
            color: white;
            padding: 5px;
        }
    </style>
</head>

<body>
    <div>
        <h1>Giải phương trình bậc hai</h1>
        <p>Phương trình bậc hai có dạng ax² + bx + c = 0</p>

        <form name="frm" action="" method="post">
            <div>
                <label for="a">Nhập a:</label>
                <input type="number" id="a" name="a" size="5">
            </div>
            <div>
                <label for="b">Nhập b:</label>
                <input type="number" id="b" name="b" size="5">
            </div>
            <div>
                <label for="c">Nhập c:</label>
                <input type="number" id="c" name="c" size="5">
            </div>

            <input type="submit" value="Giải phương trình" onclick="giaiPhuongTrinh(); return false;">
            <div id="ketqua"></div>
        </form>

        <script>
            function giaiPhuongTrinh() {
                var a = parseFloat(frm.a.value);
                var b = parseFloat(frm.b.value);
                var c = parseFloat(frm.c.value);

                if (a === 0) {
                    if (b === 0) {
                        if (c === 0) {
                            document.getElementById("ketqua").innerHTML = "<p>Phương trình có vô số nghiệm.</p>";
                        } else {
                            document.getElementById("ketqua").innerHTML = "<p>Phương trình vô nghiệm.</p>";
                        }
                    } else {
                        var x = -c / b;
                        document.getElementById("ketqua").innerHTML = "<p>Phương trình bậc nhất, nghiệm x = " + x + "</p>";
                    }
                } else {
                    var delta = b * b - 4 * a * c;

                    if (delta < 0) {
                        document.getElementById("ketqua").innerHTML = "<p>Phương trình vô nghiệm.</p>";
                    } else if (delta === 0) {
                        var x = -b / (2 * a);
                        document.getElementById("ketqua").innerHTML = "<p>Phương trình có nghiệm kép x = " + x + "</p>";
                    } else {
                        var x1 = (-b + Math.sqrt(delta)) / (2 * a);
                        var x2 = (-b - Math.sqrt(delta)) / (2 * a);
                        document.getElementById("ketqua").innerHTML = "<p>x1 = " + x1 + "<br>x2 = " + x2 + "</p>";
                    }
                }
            }
        </script>
    </div>

</body>

</html>
