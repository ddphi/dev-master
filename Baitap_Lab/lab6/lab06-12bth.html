<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function js</title>
</head>
<body>
    <h1>Function in JavaScript</h1>
    <script>
        function greet(name) {
            document.write("<p>Hello, " + name + "!</p>");
        }
        function add(a, b) {
            return a + b;
        }

        greet("duong");
        var sum = add(5, 10);
        document.write("<p>Sum: " + sum + "</p>");
    </script>
</body>
</html>
