<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do while </title>
</head>
<body>
    <script>
        var number;
        do {
            number = parseFloat(prompt("Nhập:"));
            document.write("<p>" + number + "</p>");
        } while (number !== 0);
        document.write("chuong trinh ket thuc");
    </script>
</body>
</html>
