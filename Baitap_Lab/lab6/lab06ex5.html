<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab06 - Ex5</title>
</head>
<body>
    <script>
        let pattern = "<div style='text-align: center;'>";
        
        for (let i = 0; i <= 9; i++) {
            let row = "";
            for (let j = 0; j <= i; j++) {
                row += j + " ";
            }
            for (let j = i - 1; j >= 0; j--) {
                row += j + " ";
            }
            pattern += row.trim() + "<br>";
        }
        
        pattern += "</div>";
        document.write(pattern);
    </script>
</body>
</html>
