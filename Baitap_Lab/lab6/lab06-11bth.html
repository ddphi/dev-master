<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mang trong js</title>
</head>

<body>
    <script>
        var students = ["r", "a", "z", "e", "l"];  
        document.write("<hr>");
        for (var i = 0; i < students.length; i++) {
            document.write(students[i] + "<br>");
        }
        //sap xep mang
        students.sort();
        document.write("<hr>");
        for (var i = 0; i < students.length; i++) {
            document.write(students[i] + "<br>");
        }
    </script>
</body>

</html>
