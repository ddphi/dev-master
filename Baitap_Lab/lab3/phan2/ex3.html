<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab03 - Ex3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            padding: 50px; 
        }
        ul { list-style: none; }
        a { text-decoration: none; }
        .main-menu {
            display: flex;         
            background-color: #333; 
            width: max-content;    
        }
        .main-menu > li {
            
            position: relative; 
        }
        .main-menu > li > a {
            display: block;
            padding: 15px 30px;    
            font-size: 16px;
        }
        .main-menu > li:nth-child(1) > a { color: #fbbc04; } 
        .main-menu > li:nth-child(2) > a,
        .main-menu > li:nth-child(3) > a { color: #fbbc04; } 
        .main-menu > li:hover {
            background-color: #555; 
            cursor: pointer;
        }
        .dropdown {
            position: absolute; 
            top: 100%;    
            left: 0;      
            background-color: #fff;
            min-width: 150px; 
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1); 
            display: none; 
        }
        .dropdown li a {
            display: block;
            padding: 12px 20px;
            color: #333; 
        }
        .dropdown li:hover {
            background-color: #f1f1f1; 
        }
        .main-menu > li:hover .dropdown {
            display: block; 
        }
    </style>
</head>
<body>

    <ul class="main-menu">
        <li><a href="#">Trang chủ</a></li>
        
        <li>
            <a href="#">Sản phẩm</a>
            
            <ul class="dropdown">
                <li><a href="#">Laptop</a></li>
                <li><a href="#">Điện thoại</a></li>
                <li><a href="#">Phụ kiện</a></li>
            </ul>
        </li>
        
        <li><a href="#">Liên hệ</a></li>
    </ul>

</body>
</html>
