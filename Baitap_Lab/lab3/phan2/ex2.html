<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab03 - Ex2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
        }

        .box {
            width: 250px;
            height: 250px;
            background-color: #a3ff2e; 
            position: relative; 
        }

        .badge {
            width: 50px;
            height: 50px;
            background-color: red;
            color: white;
            border-radius: 50%; 
            position: absolute;
            top: px;
            right: -0px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="badge">NEW</div>
    </div>

</body>
