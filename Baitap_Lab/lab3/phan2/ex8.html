<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab03 - Ex8</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
        }
        .card {
            width: 280px;
            background-color: #ffffff;
            border: 2px solid #fbbc04; 
            border-radius: 15px;       
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05); 
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 15px;              
        }
        .card img {
            width: 90%; 
            height: auto;
            object-fit: contain;
        }

        .card h3 {
            font-size: 18px;
            color: #111;
            text-align: center; 
        }

        .card .price {
            font-size: 18px;
            color: #ef4444; 
            font-weight: bold;
        }

        .card .btn-buy {
            background-color: #111; 
            color: white;           
            border: none;
            padding: 10px 25px;
            border-radius: 8px;     
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .card .btn-buy:hover {
            background-color: #333; 
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1603302576837-37561b2e2302?q=80&w=400&auto=format&fit=crop" alt="Dell Alienware">
        <h3>Dell Alienware 16 Aurora<br>(2025)</h3>
        <p class="price">39.690.000đ</p>
        <button class="btn-buy">Mua ngay</button>
    </div>

</body>
</html>
