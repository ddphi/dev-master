<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab03 - Ex4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            background-color: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            position: relative; 
            width: 600px;
            height: 350px;
            border-radius: 15px; 
            overflow: hidden;    
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); 
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }
        .overlay {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            text-align: center;
        }
        .overlay h2 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); 
        }
        .overlay p {
            font-size: 18px;
            margin-bottom: 25px;
        }
        .btn {
            padding: 10px 30px;
            background-color: transparent; 
            color: white;
            border: 2px solid white; 
            border-radius: 8px; 
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s; 
        }
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.3); 
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://cdn.xanhsm.com/2025/01/22be189f-bien-da-nang-4.jpg" alt="Biển Đà Nẵng">
        <div class="overlay">
            <h2>Du lịch Đà Nẵng</h2>
            <p>Biển xanh – nắng vàng – trải nghiệm tuyệt vời</p>
            <button class="btn">Xem thêm</button>
        </div>
    </div>

</body>
</html>
