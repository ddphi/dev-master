<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {
            $("a").click(function (e) {
                var mau = e.target.id;
                $("#content").addClass(mau);
            });
        });
    </script>
</head>

<body>
    <div id="main">
        <h3>Chon mau chu</h3>
        <ul class="clearfix">
            <li><a href="javascript:void(0)" id="mau do">do</a></li>
            <li><a href="javascript:void(0)" id="mau xanh">xanh</a></li>
            <li><a href="javascript:void(0)" id="mau vang">vang</a></li>
            <li><a href="javascript:void(0)" id="mau ghi">ghi</a></li>
            <li><a href="javascript:void(0)" id="mau tim">tim</a></li>
            <div id="content" class="clearfix">lap trinh web voi php</div>
        </ul>
    </div>
</body>

</html>
