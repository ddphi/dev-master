<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: auto;
            align-items: flex-start;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .left-panel {
            flex: 2;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .toolbar input,
        .toolbar select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .toolbar input {
            flex: 1;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }

        .btn-primary {
            background-color: #2b3990;
        }

        .btn-primary:hover {
            background-color: #1a2466;
        }

        .btn-action {
            padding: 5px 10px;
            font-size: 12px;
            margin-right: 5px;
        }

        .btn-view {
            background-color: #ff4d4d;
        }

        .btn-edit {
            background-color: #ffc107;
            color: black;
        }

        .btn-delete {
            background-color: #17a2b8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }

        th,
        td {
            border: 1px solid #eee;
            padding: 12px 10px;
            text-align: left;
        }

        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }

        .right-panel {
            flex: 1;
            position: sticky;
            top: 20px;
        }

        .right-panel h3 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group label {
            width: 100px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group select {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .form-group input:read-only,
        .form-group select:disabled {
            background-color: #f9f9f9;
        }

        #btnSave {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card left-panel">
            <div class="toolbar">
                <button type="button" class="btn-primary" id="btnAddNew">Thêm mới sinh viên</button>
                <input type="text" id="searchName" placeholder="Search Here">
                <button type="button" class="btn-primary" id="btnSearch">Tìm kiếm</button>
                <select id="sortOption">
                    <option value="">Sắp xếp</option>
                    <option value="name_asc">Tên A-Z</option>
                    <option value="age_asc">Tuổi tăng dần</option>
                </select>
            </div>

            <h3>Danh Sách Sinh Viên</h3>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã sinh viên</th>
                        <th>Tên sinh viên</th>
                        <th>Tuổi</th>
                        <th>Giới tính</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                </tbody>
            </table>
        </div>

        <div class="card right-panel">
            <h3>Thông Tin Sinh Viên</h3>
            <form id="studentForm">
                <div class="form-group">
                    <label>Mã sinh viên</label>
                    <input type="text" id="studentId" required>
                </div>
                <div class="form-group">
                    <label>Tên sinh viên</label>
                    <input type="text" id="studentName" required>
                </div>
                <div class="form-group">
                    <label>Tuổi</label>
                    <input type="number" id="age" min="1" required>
                </div>
                <div class="form-group">
                    <label>Giới tính</label>
                    <select id="sex" required>
                        <option value="true">Nam</option>
                        <option value="false">Nữ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ngày sinh</label>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="form-group">
                    <label>Nơi sinh</label>
                    <input type="text" id="birthPlace" required>
                </div>
                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input type="text" id="address" required>
                </div>
                <button type="submit" id="btnSave" class="btn-primary">Save</button>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            const defaultData = [
                { studentId: "SV001", studentName: "Nguyễn Văn A", age: 20, sex: true, birthDate: "2002-04-23", birthPlace: "HN", address: "25, Vũ Ngọc Phan" },
                { studentId: "SV002", studentName: "Nguyễn Văn B", age: 21, sex: false, birthDate: "2001-09-09", birthPlace: "ĐN", address: "1, Ngô Quyền" },
                { studentId: "SV003", studentName: "Nguyễn Văn C", age: 19, sex: true, birthDate: "2003-07-07", birthPlace: "HCM", address: "1, Lý Tự Trọng" },
                { studentId: "SV004", studentName: "Nguyễn Văn D", age: 29, sex: false, birthDate: "2005-07-07", birthPlace: "HCM", address: "1, Lý Tự Trọng" }
            ];

            let action = "CREATE";

            function getStudents() {
                let students = localStorage.getItem("students");
                if (!students) {
                    localStorage.setItem("students", JSON.stringify(defaultData));
                    return defaultData;
                }
                return JSON.parse(students);
            }

            function renderTable(data = getStudents()) {
                let tbody = $("#studentTableBody");
                tbody.empty();
                $.each(data, function (index, st) {
                    let tr = `<tr>
                        <td>${index + 1}</td>
                        <td>${st.studentId}</td>
                        <td>${st.studentName}</td>
                        <td>${st.age}</td>
                        <td>${st.sex ? "Nam" : "Nữ"}</td>
                        <td>
                            <button class="btn-action btn-view" data-id="${st.studentId}">Xem</button>
                            <button class="btn-action btn-edit" data-id="${st.studentId}">Sửa</button>
                            <button class="btn-action btn-delete" data-id="${st.studentId}">Xóa</button>
                        </td>
                    </tr>`;
                    tbody.append(tr);
                });
            }

            function fillForm(st) {
                $("#studentId").val(st.studentId);
                $("#studentName").val(st.studentName);
                $("#age").val(st.age);
                $("#sex").val(st.sex.toString());
                $("#birthDate").val(st.birthDate);
                $("#birthPlace").val(st.birthPlace);
                $("#address").val(st.address);
            }

            function setFormReadOnly(isReadonly) {
                $("#studentForm input").prop("readonly", isReadonly);
                $("#studentForm select").prop("disabled", isReadonly);
            }

            function resetForm() {
                $("#studentForm")[0].reset();
                setFormReadOnly(false);
                $("#studentId").prop("readonly", false);
                $("#btnSave").show();
                action = "CREATE";
            }

            $(document).on('click', '.btn-view', function () {
                let id = $(this).data('id');
                let st = getStudents().find(s => s.studentId === id);
                if (st) {
                    fillForm(st);
                    setFormReadOnly(true);
                    $("#btnSave").hide();
                    action = "VIEW";
                }
            });

            $(document).on('click', '.btn-edit', function () {
                let id = $(this).data('id');
                let st = getStudents().find(s => s.studentId === id);
                if (st) {
                    fillForm(st);
                    setFormReadOnly(false);
                    $("#studentId").prop("readonly", true);
                    $("#btnSave").show();
                    action = "UPDATE";
                }
            });

            $(document).on('click', '.btn-delete', function () {
                let id = $(this).data('id');
                if (confirm("Bạn có chắc chắn muốn xóa sinh viên này?")) {
                    let students = getStudents().filter(s => s.studentId !== id);
                    localStorage.setItem("students", JSON.stringify(students));
                    renderTable();
                    if ($("#studentId").val() === id) resetForm();
                }
            });

            $(document).on('click', '#btnAddNew', function () {
                resetForm();
            });

            $(document).on('click', '#btnSearch', function () {
                let keyword = $("#searchName").val().toLowerCase();
                let students = getStudents().filter(s => s.studentName.toLowerCase().includes(keyword));
                renderTable(students);
            });

            $(document).on('change', '#sortOption', function () {
                let option = $(this).val();
                let students = getStudents();

                if (option === "name_asc") {
                    students.sort((a, b) => a.studentName.localeCompare(b.studentName));
                } else if (option === "age_asc") {
                    students.sort((a, b) => a.age - b.age);
                }
                renderTable(students);
            });

            $("#studentForm").on("submit", function (event) {
                event.preventDefault();

                let students = getStudents();
                let stId = $("#studentId").val().trim();

                let newStudent = {
                    studentId: stId,
                    studentName: $("#studentName").val().trim(),
                    age: parseInt($("#age").val()),
                    sex: $("#sex").val() === "true",
                    birthDate: $("#birthDate").val(),
                    birthPlace: $("#birthPlace").val().trim(),
                    address: $("#address").val().trim()
                };

                if (action === "CREATE") {
                    if (students.find(s => s.studentId === stId)) {
                        alert("Mã sinh viên đã tồn tại!");
                        return;
                    }
                    students.push(newStudent);
                } else if (action === "UPDATE") {
                    let index = students.findIndex(s => s.studentId === stId);
                    if (index !== -1) students[index] = newStudent;
                }

                localStorage.setItem("students", JSON.stringify(students));
                renderTable();
                resetForm();
            });

            renderTable();
        });
    </script>
</body>

</html>
