<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab04-ex9</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ffea00;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 22px;
            color: #1b9d46;
            text-transform: uppercase;
        }

        .btn-view-all {
            background-color: #ffea00;
            color: #1b9d46;
            text-decoration: none;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: opacity 0.3s ease;
        }

        .btn-view-all:hover {
            opacity: 0.8;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            border: 2px solid #1b9d46;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            background-color: #1b9d46;
        }

        .product-card:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-5px);
        }

        .card-image {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #fff;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .product-card:hover .overlay {
            opacity: 1;
        }

        .btn-view-more {
            background-color: rgba(0, 0, 0, 0.7);
            color: #ffea00;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-view-more:hover {
            background-color: #000;
        }

        .card-info {
            padding: 15px 10px;
            flex-grow: 1;
        }

        .product-name {
            font-size: 15px;
            color: #fff;
            line-height: 1.4;
            font-weight: normal;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 13px;
            color: #fff;
        }

        .price, .views {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-buy {
            background-color: #ffea00;
            color: #1b9d46;
            text-decoration: none;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: opacity 0.3s;
        }

        .btn-buy:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Phân bón vi sinh</h2>
            <a href="#" class="btn-view-all">Xem tất cả <i class="fa-solid fa-circle-arrow-right"></i></a>
        </div>

        <div class="product-grid">
            <div class="product-card">
                <div class="card-image">
                    <img src="https://thanhchaubiotech.vn/images/product-category/azoto-1761032200.jpg" alt="Phân bón vi sinh Thành Châu">
                    <div class="overlay">
                        <a href="#" class="btn-view-more">XEM THÊM</a>
                    </div>
                </div>
                <div class="card-info">
                    <h3 class="product-name">Phân bón vi sinh Thành Châu <br> (Azotobacterin)</h3>
                </div>
                <div class="card-footer">
                    <span class="price"><i class="fa-solid fa-money-bill"></i> Liên hệ giá</span>
                    <span class="views"><i class="fa-regular fa-eye"></i> 193</span>
                    <a href="#" class="btn-buy">Mua hàng <i class="fa-solid fa-circle-arrow-right"></i></a>
                </div>
            </div>

            <div class="product-card">
                <div class="card-image">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_Z9LYJ3hq-nD0zRV5Qg06ygRLRABa403gWuOtZiZ-GoIivJ68" alt="Sản phẩm đang cập nhật">
                    <div class="overlay">
                        <a href="#" class="btn-view-more">XEM THÊM</a>
                    </div>
                </div>
                <div class="card-info">
                    <h3 class="product-name">Sản phẩm đang cập nhật ...</h3>
                </div>
                <div class="card-footer">
                    <span class="price"><i class="fa-solid fa-money-bill"></i> 0.000 ₫</span>
                    <a href="#" class="btn-buy">Mua hàng <i class="fa-solid fa-circle-arrow-right"></i></a>
                </div>
            </div>

            <div class="product-card">
                <div class="card-image">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_Z9LYJ3hq-nD0zRV5Qg06ygRLRABa403gWuOtZiZ-GoIivJ68" alt="Sản phẩm đang cập nhật">
                    <div class="overlay">
                        <a href="#" class="btn-view-more">XEM THÊM</a>
                    </div>
                </div>
                <div class="card-info">
                    <h3 class="product-name">Sản phẩm đang cập nhật ...</h3>
                </div>
                <div class="card-footer">
                    <span class="price"><i class="fa-solid fa-money-bill"></i> 0.000 ₫</span>
                    <a href="#" class="btn-buy">Mua hàng <i class="fa-solid fa-circle-arrow-right"></i></a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
