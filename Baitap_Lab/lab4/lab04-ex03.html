<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab04-ex3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f9f9f9;
            padding: 50px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 40px;
            text-transform: uppercase;
            position: relative;
        }

        .section-title::after {
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            background-color: #2eac4d;
            margin: 10px auto 0;
        }

        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            position: relative;
            width: 350px;
            height: 250px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 40, 50, 0.7);
            transition: background-color 0.3s ease;
            z-index: 1;
        }

        .card:hover .overlay {
            background-color: rgba(46, 172, 77, 0.85);
        }

        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .icon {
            width: 70px;
            height: 70px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #2eac4d;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn {
            padding: 8px 30px;
            background-color: transparent;
            color: white;
            border: 1px solid white;
            border-radius: 25px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover .btn {
            background-color: #f39c12;
            border-color: #f39c12;
        }
    </style>
</head>
<body>

    <h2 class="section-title">Dịch Vụ</h2>

    <div class="card-container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1580674285054-bed31e145f59?q=80&w=600&auto=format&fit=crop" alt="Vận tải nội địa">
            <div class="overlay"></div>
            <div class="content">
                <div class="icon">
                    <i></i>
                </div>
                <p class="subtitle">Dịch vụ</p>
                <h3 class="title">Vận tải nội địa</h3>
                <button class="btn">CHI TIẾT</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?q=80&w=600&auto=format&fit=crop" alt="Uỷ thác xuất nhập khẩu">
            <div class="overlay"></div>
            <div class="content">
                <div class="icon">
                    <i></i>
                </div>
                <p class="subtitle">Dịch vụ</p>
                <h3 class="title">Uỷ thác xuất nhập khẩu</h3>
                <button class="btn">CHI TIẾT</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1556761175-5973dc0f32e7?q=80&w=600&auto=format&fit=crop" alt="Tư vấn xuất khẩu lao động">
            <div class="overlay"></div>
            <div class="content">
                <div class="icon">
                    <i></i>
                </div>
                <p class="subtitle">Dịch vụ</p>
                <h3 class="title">Tư vấn xuất khẩu lao động</h3>
                <button class="btn">CHI TIẾT</button>
            </div>
        </div>
    </div>

</body>
</html>
